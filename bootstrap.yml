---
- hosts: newservers
  become: true
  vars:
    sshd_port: 22
    logwatch_email: indelible.bonobo@gmail.com
    deploy_username: deploy
    deploy_password: '$6$AC3bdCF7!$eHIelM7KoGe6.3wM6lHWbLjm63unpALTbNf.tnbSRfg8Wkb3wjSWPNglp0QWP3WtwrYJLy78l8BD86OQ7hP5T0'
    # Crypted password, generated on Linux: python3 -c 'import crypt,getpass; print(crypt.crypt(getpass.getpass(), crypt.mksalt(crypt.METHOD_SHA512)))'

  tasks:
  - name: Update APT package cache
    ansible.builtin.apt:
      update_cache: true
      cache_valid_time: 3600

  - name: Run apt-get upgrade
    ansible.builtin.apt:
      upgrade: dist
      update_cache: true

  - name: Install fail2ban
    ansible.builtin.apt:
      pkg: fail2ban
      state: present

  - name: Bootstrap deploy user (only when connecting as root)
    when: ansible_user == 'root'
    block:
      - name: Install sudo
        ansible.builtin.apt:
          pkg: sudo
          state: present

      - name: Create deploy user
        ansible.builtin.user:
          name: "{{ deploy_username }}"
          shell: /bin/bash
          create_home: true
        # password: removed - set manually after bootstrap

      - name: Set deploy user's authorized key
        ansible.posix.authorized_key:
          user: "{{ deploy_username }}"
          key: "{{ lookup('file', 'ibonobo.pub') }}"
          # state: present

      - name: Remove sudo group rights
        ansible.builtin.lineinfile:
          dest: /etc/sudoers
          regexp: "^%sudo"
          state: absent
          validate: '/usr/sbin/visudo -cf %s'

      - name: Add deploy user to sudoers
        ansible.builtin.lineinfile:
          dest: /etc/sudoers
          regexp: "{{ deploy_username }} ALL"
          line: "{{ deploy_username }} ALL=(ALL) NOPASSWD:ALL"
          state: present
          validate: '/usr/sbin/visudo -cf %s'

  - name: Disallow root SSH access
    ansible.builtin.lineinfile:
      dest: /etc/ssh/sshd_config
      regexp: "^PermitRootLogin"
      line: "PermitRootLogin no"
      state: present
    notify: Restart sshd

  - name: Disallow password authentication
    ansible.builtin.lineinfile:
      dest: /etc/ssh/sshd_config
      regexp: "^PasswordAuthentication"
      line: "PasswordAuthentication no"
      state: present
    notify: Restart sshd

  - name: Change SSHd port
    ansible.builtin.lineinfile:
      dest: /etc/ssh/sshd_config
      regexp: "^Port"
      line: "Port {{ sshd_port }}"
      state: present
    notify: Restart sshd

  - name: Obfuscate Debian Fingerprints for OS identification
    ansible.builtin.lineinfile:
      dest: /etc/ssh/sshd_config
      regexp: "^DebianBanner"
      line: "DebianBanner no"
      state: present
    notify: Restart sshd

  - name: Install unattended-upgrades
    ansible.builtin.apt:
      pkg: unattended-upgrades
      state: present

  - name: Adjust APT update intervals
    ansible.builtin.copy:
      src: config/apt_periodic
      dest: /etc/apt/apt.conf.d/10periodic
      mode: '0644'

  - name: Make sure unattended-upgrades only installs from security updates
    ansible.builtin.lineinfile:
      dest: /etc/apt/apt.conf.d/50unattended-upgrades
      regexp: "{{ ansible_distribution_release }}-updates"
      state: absent

  - name: Copy debconf selections so that Postfix can configure itself non-interactively
    ansible.builtin.copy:
      src: config/postfix_selections
      dest: /tmp/postfix_selections
      mode: '0644'

  - name: Set up Postfix to relay mail
    ansible.builtin.command:
      cmd: debconf-set-selections /tmp/postfix_selections
    changed_when: false

  - name: Install logwatch
    ansible.builtin.apt:
      pkg: logwatch
      state: present

  - name: Make logwatch mail daily
    ansible.builtin.lineinfile:
      dest: /etc/cron.daily/00logwatch
      regexp: "^/usr/sbin/logwatch"
      line: "/usr/sbin/logwatch --output mail --mailto {{ logwatch_email }} --detail high"
      state: present
      create: true
      mode: '0755'

  - name: Check for outbound IPv4 connectivity
    ansible.builtin.wait_for:
      host: 1.1.1.1
      port: 443
      timeout: 5
    register: ipv4_check
    ignore_errors: true

  - name: Set primary DNS in systemd-resolved (IPv6-only hosts)
    ansible.builtin.lineinfile:
      dest: /etc/systemd/resolved.conf
      regexp: "^#?DNS="
      line: "DNS=2a01:4f8:cdc:123f::1 2a00:1098:2b::1"
      state: present
    when: ipv4_check is failed
    notify: Restart systemd-resolved

  - name: Set fallback DNS in systemd-resolved (IPv6-only hosts)
    ansible.builtin.lineinfile:
      dest: /etc/systemd/resolved.conf
      regexp: "^#?FallbackDNS="
      line: "FallbackDNS=2a00:1098:2c::1"
      state: present
    when: ipv4_check is failed
    notify: Restart systemd-resolved

  - name: Configure fail2ban sshd jail
    ansible.builtin.copy:
      dest: /etc/fail2ban/jail.local
      mode: '0644'
      content: |
        [sshd]
        enabled = true
        port = {{ sshd_port }}
        backend = systemd
    notify: Restart fail2ban

  handlers:
  - name: Restart sshd
    ansible.builtin.service:
      name: ssh
      state: restarted

  - name: Restart systemd-resolved
    ansible.builtin.service:
      name: systemd-resolved
      state: restarted

  - name: Restart fail2ban
    ansible.builtin.service:
      name: fail2ban
      state: restarted
